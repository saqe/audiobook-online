# Fly.io config. Replace the app name and region before `fly launch` / `fly deploy`.
# S3 credentials are NOT stored here; set them with `fly secrets set` (see README.md).

app = "saqib-audiobookshelf"
primary_region = "sin"

# Swap for the 256 MB machine. Must be a top-level key; inside [[vm]] Fly ignores it.
swap_size_mb = 512

[build]
  dockerfile = "Dockerfile"

  # Pinned by digest; keep in sync with the Dockerfile ARGs.
  [build.args]
    ABS_IMAGE = "ghcr.io/advplyr/audiobookshelf:2.37.2@sha256:b897c33f05972fb1bf484f7487bc878fa91ec8691335c1db6e2929c3a7658efa"
    RCLONE_IMAGE = "rclone/rclone:1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466"
    CLOUDFLARED_IMAGE = "cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba"

[env]
  # Non-secret S3 settings. Change the provider/endpoint to match your storage.
  S3_PROVIDER = "Cloudflare"          # Cloudflare (R2), Other (B2 S3 API, Tigris, ...), AWS, Minio
  S3_REGION = "auto"                  # R2: auto. B2: region from the endpoint, e.g. us-west-004. AWS: e.g. us-east-1

  # Persistent state on the volume below.
  CONFIG_PATH = "/data/config"
  METADATA_PATH = "/data/metadata"
  CACHE_DIR = "/data/rclone-cache"

  # Audio is streamed from S3 and never stored on the volume (VFS_CACHE_MODE=off).
  # The volume only holds the database, config, and cover images.
  VFS_CACHE_MODE = "off"
  DIR_CACHE_TIME = "5m"

[[mounts]]
  source = "abs_data"
  destination = "/data"
  initial_size = "1gb"

# No [http_service]: the app has no public address. It is reachable only through
# Cloudflare Tunnel, behind Cloudflare Access (see README.md, "Private access with
# Cloudflare"). TUNNEL_TOKEN is a Fly secret. Keep one machine
# running: the volume is attached to one machine, and stopping it would
# interrupt playback.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
