# Fly.io config. Replace the app name and region before `fly launch` / `fly deploy`.
# S3 credentials are NOT stored here; set them with `fly secrets set` (see README.md).

app = "saqib-audiobookshelf"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    ABS_IMAGE = "ghcr.io/advplyr/audiobookshelf:2.37.2"
    RCLONE_IMAGE = "rclone/rclone:1.76.0"

[env]
  # Non-secret S3 settings. Change the provider/endpoint to match your storage.
  S3_PROVIDER = "Cloudflare"          # Cloudflare (R2), Other (B2 S3 API, Tigris, ...), AWS, Minio
  S3_REGION = "auto"                  # R2: auto. B2: region from the endpoint, e.g. us-west-004. AWS: e.g. us-east-1
  # S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY are secrets.
  # S3_PREFIX = "audiobooks"          # optional: only mount this folder of the bucket

  # Persistent state on the volume below.
  CONFIG_PATH = "/data/config"
  METADATA_PATH = "/data/metadata"
  CACHE_DIR = "/data/rclone-cache"

  # Name of this app's machine on your tailnet. TS_AUTHKEY is a secret (see README).
  TS_HOSTNAME = "audiobookshelf"

  # Audio is streamed from S3 and never stored on the volume (VFS_CACHE_MODE=off).
  # The volume only holds the database, config, and cover images.
  VFS_CACHE_MODE = "off"
  DIR_CACHE_TIME = "5m"

[[mounts]]
  source = "abs_data"
  destination = "/data"
  initial_size = "1gb"

# No [http_service]: the app has no public address. It is reachable only over
# Tailscale (see README.md, "Private access with Tailscale"). Keep one machine
# running: the volume is attached to one machine, and stopping it would
# interrupt playback.

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
